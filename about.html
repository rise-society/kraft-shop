<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f7; color: #1d1d1f; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; -webkit-font-smoothing: antialiased; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .container { max-width: 500px; padding: 20px; animation: fadeInUp 1s ease-out; }
        h1 { font-size: 40px; font-weight: 600; margin-bottom: 20px; }
        p { font-size: 21px; line-height: 1.4; color: #515154; margin-bottom: 40px; }
        .back-link { color: #0066cc; text-decoration: none; font-size: 19px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>О магазине.</h1>
        <p>Мы поставляем качественную крафт-упаковку в Астане, помогая вашему бизнесу быть стильным и экологичным.</p>
        <a href="index.html" class="back-link">< Назад к товарам</a>
    </div>
</body>
</html>
