<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <style>
        /* Базовые стили Apple */
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #f5f5f7; margin: 0; overflow-x: hidden; }
        
        /* Анимация появления */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px; animation: fadeInUp 1.2s ease-out; }
        
        h1 { font-size: 48px; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
        .subtitle { font-size: 24px; color: #86868b; margin-top: 10px; }
        
        .card-container { padding: 40px 20px; display: flex; flex-direction: column; gap: 20px; max-width: 500px; margin: 0 auto; }
        
        .product-card { background: #1d1d1f; border-radius: 22px; padding: 30px; animation: fadeInUp 1.5s ease-out; }
        
        .price { color: #86868b; font-size: 18px; margin: 15px 0; }
        
        .links { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
        .links a { color: #2997ff; text-decoration: none; font-size: 19px; }
        .links a:hover { text-decoration: underline; }

        .btn-buy { background: #0071e3; color: white; padding: 12px 24px; border-radius: 980px; text-decoration: none; font-weight: 400; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Kraft Shop KZ</h1>
        <p class="subtitle">Упаковка, достойная ваших идей.</p>
        <div class="links">
            <a href="about.html">Подробнее ></a>
            <a href="https://t.me/craftshopkz">Купить ></a>
        </div>
    </div>

    <div class="card-container">
        <div class="product-card">
            <h2>Крафт-пакет (S)</h2>
            <p class="price">От 15 ₸</p>
            <a href="https://t.me/craftshopkz" class="btn-buy">Заказать</a>
        </div>
        <div class="product-card">
            <h2>Крафт-пакет (L)</h2>
            <p class="price">От 35 ₸</p>
            <a href="https://t.me/craftshopkz" class="btn-buy">Заказать</a>
        </div>
    </div>
</body>
</html>
