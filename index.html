<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; color: #1d1d1f; margin: 0; padding: 20px; }
        .breadcrumb { font-size: 13px; color: #86868b; margin-bottom: 20px; }
        .breadcrumb a { color: #3b3b8f; text-decoration: none; }
        
        h1 { font-size: 22px; font-weight: 700; color: #3b3b8f; margin-bottom: 25px; }

        /* Синий блок контактов как на скрине */
        .contact-card {
            background: #f0f0f5; border-radius: 20px; padding: 25px;
            margin-bottom: 30px; position: relative;
        }
        .info-row { display: flex; margin-bottom: 15px; font-size: 16px; }
        .label { width: 100px; color: #3b3b8f; font-weight: 500; }
        .value { flex: 1; color: #3b3b8f; }
        .value a { color: #3b3b8f; text-decoration: underline; display: block; margin-bottom: 5px; }

        .social-icons { display: flex; gap: 20px; margin-top: 20px; justify-content: flex-end; }
        .social-icons img { width: 24px; opacity: 0.7; }

        /* Форма обратной связи */
        .form-title { font-size: 18px; font-weight: 700; color: #3b3b8f; margin-bottom: 5px; }
        .form-subtitle { font-size: 14px; color: #d03e3e; margin-bottom: 20px; }
        
        input, textarea {
            width: 100%; border: 1px solid #d2d2d7; border-radius: 25px;
            padding: 15px 20px; margin-bottom: 15px; font-size: 16px;
            box-sizing: border-box; outline: none; background: #fff;
        }
        textarea { height: 120px; border-radius: 20px; resize: none; }
        
        .btn-send {
            background: #4e4ec2; color: #fff; border: none; width: 100%;
            padding: 15px; border-radius: 25px; font-size: 16px; font-weight: 600;
        }

        /* Синяя кнопка чата */
        .chat-btn {
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
            background: #4e4ec2; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; color: #fff; font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="breadcrumb">
        <a href="index.html">Главная</a> — Контакты
    </div>

    <h1>Контакты</h1>

    <div class="contact-card">
        <div class="info-row">
            <div class="label">E-mail:</div>
            <div class="value"><a href="mailto:info@bizkim.uz">info@kraftshop.kz</a></div>
        </div>
        <div class="info-row">
            <div class="label">Телефон:</div>
            <div class="value">
                <a href="tel:+77000000000">+7 700 000 99 88</a>
                <a href="tel:+77172000000">+7 7172 33 99 88</a>
            </div>
        </div>
        <div class="social-icons">
            <span>f</span> <span>✈</span> <span>📷</span>
        </div>
    </div>

    <div class="form-title">Форма обратной связи *</div>
    <div class="form-subtitle">Если у вас есть вопросы или предложения, напишите нам</div>

    <form action="https://formspree.io/f/ВАШ_ID" method="POST">
        <input type="text" name="name" placeholder="Имя" required>
        <input type="email" name="email" placeholder="E-mail" required>
        <input type="tel" name="phone" placeholder="Телефон" required>
        <textarea name="message" placeholder="Ваше сообщение"></textarea>
        <button type="submit" class="btn-send">Отправить сообщение</button>
    </form>

    <div class="chat-btn">💬</div>
</body>
</html>
