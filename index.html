<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; margin: 0; -webkit-font-smoothing: antialiased; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 20px; animation: fadeInUp 1.2s ease-out; }
        h1 { font-size: 48px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
        .subtitle { font-size: 24px; color: #86868b; margin: 10px 0 30px; }
        .cta { display: flex; gap: 30px; }
        .cta a { color: #2997ff; text-decoration: none; font-size: 21px; }
        .section { padding: 80px 20px; max-width: 500px; margin: 0 auto; }
        .card { background: #1d1d1f; border-radius: 22px; padding: 30px; margin-bottom: 20px; text-align: center; animation: fadeInUp 1.5s ease-out; }
        .price { color: #86868b; font-size: 18px; margin-bottom: 20px; }
        .btn { background: #0071e3; color: #fff; padding: 12px 24px; border-radius: 980px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Kraft Shop KZ</h1>
        <p class="subtitle">Астана. Просто. Экологично.</p>
        <div class="cta">
            <a href="about.html">О нас ></a>
            <a href="https://t.me/craftshopkz">Купить ></a>
        </div>
    </div>
    <div class="section">
        <div class="card">
            <h2>Пакет (S)</h2>
            <p class="price">15 ₸</p>
            <a href="https://t.me/craftshopkz" class="btn">Заказать</a>
        </div>
        <div class="card">
            <h2>Пакет (L)</h2>
            <p class="price">35 ₸</p>
            <a href="https://t.me/craftshopkz" class="btn">Заказать</a>
        </div>
    </div>
</body>
</html>
